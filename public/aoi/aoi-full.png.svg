<svg width="400" height="800" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fullBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B8FD9;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#7BA7BC;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="bodysuitFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F8F8F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4E2C;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coreGlowFull">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4E6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00A8C0;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="800" fill="url(#fullBg)" rx="20"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="320" rx="140" ry="250" fill="url(#coreGlowFull)" opacity="0.15" filter="blur(70px)"/>

  <!-- Full body character -->
  <g transform="translate(200, 180)">
    <!-- Hair (brown wavy, shoulder-length) -->
    <ellipse cx="0" cy="-15" rx="70" ry="45" fill="url(#hairFull)"/>
    <path d="M -70,-15 Q -75,0 -70,20 L -65,45" stroke="url(#hairFull)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 70,-15 Q 75,0 70,20 L 65,45" stroke="url(#hairFull)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M -50,-30 Q -25,-40 0,-42 Q 25,-40 50,-30" fill="url(#hairFull)"/>

    <!-- Side-swept bangs -->
    <path d="M -55,-25 Q -35,-32 -15,-28 Q -5,-23 0,-15" fill="url(#hairFull)" opacity="0.9"/>
    <path d="M -40,-30 Q -20,-35 -5,-32" stroke="url(#hairFull)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M -25,-32 Q -10,-36 5,-32" stroke="url(#hairFull)" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- Head/Face -->
    <ellipse cx="0" cy="5" rx="55" ry="65" fill="#FFE8D6"/>

    <!-- Eyes (large expressive, amber) -->
    <ellipse cx="-20" cy="-2" rx="12" ry="17" fill="#FFFFFF"/>
    <ellipse cx="20" cy="-2" rx="12" ry="17" fill="#FFFFFF"/>
    <ellipse cx="-20" cy="0" rx="9" ry="13" fill="#D2A44C"/>
    <ellipse cx="20" cy="0" rx="9" ry="13" fill="#D2A44C"/>
    <circle cx="-20" cy="-2" r="5" fill="#6B4E2C"/>
    <circle cx="20" cy="-2" r="5" fill="#6B4E2C"/>
    <circle cx="-17" cy="-5" r="2" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="23" cy="-5" r="2" fill="#FFFFFF" opacity="0.95"/>

    <!-- Confident smile -->
    <path d="M -18,23 Q 0,30 18,23" stroke="#9B8FD9" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-16" y="60" width="32" height="28" fill="#FFE8D6"/>

    <!-- Tech collar with mechanical details -->
    <path d="M -38,88 L -32,72 L 32,72 L 38,88 Z" fill="#9B8FD9" opacity="0.9"/>
    <rect x="-28" y="75" width="12" height="4" rx="1" fill="#00F0FF" opacity="0.8"/>
    <rect x="16" y="75" width="12" height="4" rx="1" fill="#00F0FF" opacity="0.8"/>
    <circle cx="-22" cy="77" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="22" cy="77" r="1.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- Futuristic bodysuit (white) -->
    <path d="M -42,88 L -50,140 L -48,240 L -42,380 L 42,380 L 48,240 L 50,140 L 42,88 Z"
          fill="url(#bodysuitFull)" stroke="#E0E0E0" stroke-width="1" opacity="0.98"/>

    <!-- Purple shoulder guards -->
    <ellipse cx="-50" cy="100" rx="18" ry="25" fill="#9B8FD9" opacity="0.95"/>
    <ellipse cx="50" cy="100" rx="18" ry="25" fill="#9B8FD9" opacity="0.95"/>
    <rect x="-54" y="110" width="8" height="4" rx="1" fill="#7BA7BC" opacity="0.7"/>
    <rect x="46" y="110" width="8" height="4" rx="1" fill="#7BA7BC" opacity="0.7"/>

    <!-- Cyan glowing chest core (central power indicator) -->
    <circle cx="0" cy="160" r="25" fill="#00F0FF" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="160" r="18" fill="#00F0FF" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="160" r="12" fill="#00DDEE" opacity="0.8">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="160" r="6" fill="#00F5FF" opacity="1"/>

    <!-- Core geometric details -->
    <circle cx="0" cy="160" r="14" stroke="#00F0FF" stroke-width="1" fill="none" opacity="0.6"/>
    <line x1="-10" y1="160" x2="10" y2="160" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="150" x2="0" y2="170" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

    <!-- Purple arm sections -->
    <rect x="-65" y="125" width="16" height="85" rx="4" fill="#9B8FD9" opacity="0.85"/>
    <rect x="49" y="125" width="16" height="85" rx="4" fill="#9B8FD9" opacity="0.85"/>

    <!-- Cyan technical panels on bodysuit -->
    <rect x="-35" y="120" width="8" height="50" rx="2" fill="#7BA7BC" opacity="0.5"/>
    <rect x="27" y="120" width="8" height="50" rx="2" fill="#7BA7BC" opacity="0.5"/>
    <line x1="-25" y1="130" x2="-30" y2="200" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
    <line x1="25" y1="130" x2="30" y2="200" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>

    <!-- Tech lines and details -->
    <rect x="-38" y="210" width="76" height="2" rx="1" fill="#7BA7BC" opacity="0.4"/>
    <rect x="-30" y="240" width="60" height="2" rx="1" fill="#00F0FF" opacity="0.3"/>

    <!-- Arms (white bodysuit material) -->
    <path d="M -65,130 L -72,190 L -76,250 L -74,290" stroke="#FFFFFF" stroke-width="22"
          fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 65,130 L 72,190 L 76,250 L 74,290" stroke="#FFFFFF" stroke-width="22"
          fill="none" stroke-linecap="round" opacity="0.95"/>

    <!-- Purple arm panels on forearms -->
    <path d="M -72,200 L -76,250" stroke="#9B8FD9" stroke-width="16" opacity="0.8"/>
    <path d="M 72,200 L 76,250" stroke="#9B8FD9" stroke-width="16" opacity="0.8"/>

    <!-- Tech bracelet with cyan glow -->
    <rect x="-80" y="270" width="14" height="8" rx="3" fill="#00F0FF" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="-73" cy="274" r="2" fill="#FFFFFF" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Hands -->
    <ellipse cx="-74" cy="295" rx="13" ry="15" fill="#FFE8D6"/>
    <ellipse cx="74" cy="295" rx="13" ry="15" fill="#FFE8D6"/>

    <!-- Badge with kanji -->
    <circle cx="38" cy="135" r="12" fill="#D2A44C" opacity="0.95"/>
    <text x="38" y="141" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">葵</text>

    <!-- Lower body - purple leg panels -->
    <path d="M -42,380 L -38,460 L -35,540 L 35,540 L 38,460 L 42,380 Z" fill="url(#bodysuitFull)" opacity="0.95"/>

    <!-- Purple leg sections -->
    <rect x="-40" y="380" width="14" height="120" rx="3" fill="#9B8FD9" opacity="0.75"/>
    <rect x="26" y="380" width="14" height="120" rx="3" fill="#9B8FD9" opacity="0.75"/>

    <!-- Cyan accent lines on legs -->
    <line x1="-28" y1="390" x2="-32" y2="490" stroke="#00F0FF" stroke-width="2" opacity="0.5"/>
    <line x1="28" y1="390" x2="32" y2="490" stroke="#00F0FF" stroke-width="2" opacity="0.5"/>

    <!-- White boots with blue accent lights -->
    <ellipse cx="-35" cy="545" rx="16" ry="22" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="35" cy="545" rx="16" ry="22" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-40" y="550" width="10" height="3" rx="1" fill="#00F0FF" opacity="0.8"/>
    <rect x="30" y="550" width="10" height="3" rx="1" fill="#00F0FF" opacity="0.8"/>

    <!-- Interface glow elements -->
    <circle cx="-48" cy="220" r="4" fill="#00F0FF" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="220" r="4" fill="#7BA7BC" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-45" cy="260" r="3" fill="#9B8FD9" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text labels -->
  <text x="200" y="705" font-size="40" fill="#9B8FD9" text-anchor="middle" font-weight="bold">aOi (葵)</text>
  <text x="200" y="742" font-size="20" fill="#7BA7BC" text-anchor="middle">Core AI Orchestrator</text>
  <text x="200" y="768" font-size="16" fill="#8FA68E" text-anchor="middle" opacity="0.8">Soft + Tech + Academic</text>
</svg>
