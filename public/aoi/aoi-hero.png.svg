<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B8FD9;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#7BA7BC;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="bodysuitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4E2C;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4E6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00A8C0;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" rx="20"/>

  <!-- Ambient glow -->
  <circle cx="300" cy="280" r="180" fill="url(#coreGlow)" opacity="0.2" filter="blur(60px)"/>

  <!-- Character -->
  <g transform="translate(300, 300)">
    <!-- Hair (brown wavy, shoulder-length) -->
    <ellipse cx="0" cy="-90" rx="75" ry="50" fill="url(#hairGrad)"/>
    <path d="M -75,-90 Q -80,-70 -70,-50 L -65,-30" stroke="url(#hairGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 75,-90 Q 80,-70 70,-50 L 65,-30" stroke="url(#hairGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M -50,-105 Q -30,-115 0,-118 Q 30,-115 50,-105" fill="url(#hairGrad)"/>

    <!-- Side-swept bangs -->
    <path d="M -60,-95 Q -40,-100 -20,-95 Q -10,-90 -5,-80" fill="url(#hairGrad)" opacity="0.9"/>
    <path d="M -30,-100 Q -15,-105 0,-100" stroke="url(#hairGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Head/Face -->
    <ellipse cx="0" cy="-70" rx="60" ry="70" fill="#FFE8D6"/>

    <!-- Eyes (large, expressive, amber/golden-brown) -->
    <ellipse cx="-22" cy="-75" rx="13" ry="18" fill="#FFFFFF"/>
    <ellipse cx="22" cy="-75" rx="13" ry="18" fill="#FFFFFF"/>
    <ellipse cx="-22" cy="-73" rx="10" ry="14" fill="#D2A44C"/>
    <ellipse cx="22" cy="-73" rx="10" ry="14" fill="#D2A44C"/>
    <circle cx="-22" cy="-75" r="5" fill="#6B4E2C"/>
    <circle cx="22" cy="-75" r="5" fill="#6B4E2C"/>
    <circle cx="-19" cy="-78" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="25" cy="-78" r="2" fill="#FFFFFF" opacity="0.9"/>

    <!-- Friendly confident smile -->
    <path d="M -20,-50 Q 0,-44 20,-50" stroke="#9B8FD9" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-18" y="-25" width="36" height="30" fill="#FFE8D6"/>

    <!-- Tech collar -->
    <path d="M -35,5 L -30,-10 L 30,-10 L 35,5 Z" fill="#9B8FD9" opacity="0.9"/>
    <rect x="-28" y="-8" width="10" height="3" rx="1" fill="#00F0FF" opacity="0.8"/>
    <rect x="18" y="-8" width="10" height="3" rx="1" fill="#00F0FF" opacity="0.8"/>

    <!-- Bodysuit (white with tech panels) -->
    <path d="M -40,5 L -50,50 L -45,130 L 45,130 L 50,50 L 40,5 Z" fill="url(#bodysuitGrad)" opacity="0.95"/>

    <!-- Cyan glowing chest core (central power indicator) -->
    <circle cx="0" cy="50" r="18" fill="#00F0FF" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="50" r="12" fill="#00F0FF" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="50" r="6" fill="#00DDEE" opacity="0.9">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Purple shoulder guards -->
    <ellipse cx="-48" cy="15" rx="15" ry="20" fill="#9B8FD9" opacity="0.9"/>
    <ellipse cx="48" cy="15" rx="15" ry="20" fill="#9B8FD9" opacity="0.9"/>

    <!-- Purple arm panels -->
    <rect x="-60" y="30" width="12" height="60" rx="3" fill="#9B8FD9" opacity="0.8"/>
    <rect x="48" y="30" width="12" height="60" rx="3" fill="#9B8FD9" opacity="0.8"/>

    <!-- Cyan technical lines on bodysuit -->
    <line x1="-20" y1="30" x2="-25" y2="80" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="30" x2="25" y2="80" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
    <rect x="-30" y="90" width="60" height="2" rx="1" fill="#7BA7BC" opacity="0.5"/>

    <!-- Arms -->
    <path d="M -60,35 L -65,70 L -68,100" stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 60,35 L 65,70 L 68,100" stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.95"/>

    <!-- Tech bracelet/detail -->
    <rect x="-72" y="88" width="10" height="6" rx="2" fill="#00F0FF" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Badge with kanji -->
    <circle cx="35" cy="25" r="10" fill="#D2A44C" opacity="0.9"/>
    <text x="35" y="30" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">葵</text>

    <!-- Interface glow elements -->
    <circle cx="-42" cy="70" r="3" fill="#00F0FF" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="70" r="3" fill="#7BA7BC" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text labels -->
  <text x="300" y="520" font-size="36" fill="#9B8FD9" text-anchor="middle" font-weight="bold">aOi (葵)</text>
  <text x="300" y="555" font-size="18" fill="#7BA7BC" text-anchor="middle">AI Orchestrator & Guide</text>
  <text x="300" y="580" font-size="14" fill="#8FA68E" text-anchor="middle" opacity="0.8">Soft + Tech + Academic</text>
</svg>
