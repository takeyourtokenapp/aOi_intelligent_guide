<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft gradient background -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e0b4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9b87f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:0.8" />
    </radialGradient>

    <linearGradient id="tech-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D2A44C;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" opacity="0.95"/>

  <!-- Subtle tech pattern -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#tech-glow)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#tech-glow)" stroke-width="1" opacity="0.3"/>

  <!-- Central kanji 葵 -->
  <text x="256" y="320" font-family="serif" font-size="180" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">葵</text>

  <!-- Sparkle accents -->
  <g opacity="0.6">
    <circle cx="160" cy="160" r="4" fill="white"/>
    <circle cx="352" cy="160" r="3" fill="white"/>
    <circle cx="160" cy="352" r="3" fill="white"/>
    <circle cx="352" cy="352" r="4" fill="white"/>
  </g>

  <!-- Level indicator: beginner (soft glow) -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="white" stroke-width="4" opacity="0.2"/>
</svg>
