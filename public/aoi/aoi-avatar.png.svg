<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B8FD9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7BA7BC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowAvatar">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#D2A44C;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBg)"/>

  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#glowAvatar)"/>

  <!-- Character face -->
  <g transform="translate(100, 100)">
    <!-- Head -->
    <ellipse cx="0" cy="-10" rx="45" ry="50" fill="#E8E4F3"/>

    <!-- Eyes (big, expressive, kind) -->
    <ellipse cx="-18" cy="-15" rx="10" ry="14" fill="#FFFFFF"/>
    <ellipse cx="18" cy="-15" rx="10" ry="14" fill="#FFFFFF"/>
    <circle cx="-18" cy="-13" r="5" fill="#5B6C8F"/>
    <circle cx="18" cy="-13" r="5" fill="#5B6C8F"/>

    <!-- Gentle smile -->
    <path d="M -15,5 Q 0,10 15,5" stroke="#9B8FD9" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Tech badge on side -->
    <circle cx="35" cy="-5" r="6" fill="#D2A44C"/>
    <text x="35" y="-1" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">葵</text>

    <!-- Status indicator -->
    <circle cx="42" cy="-35" r="4" fill="#00FF00">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Character label -->
  <text x="100" y="175" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">aOi</text>
</svg>
