<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E4F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7BA7BC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairAvatar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4E2C;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coreGlowAvatar">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F0FF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBg)"/>

  <!-- Glow effect -->
  <circle cx="100" cy="100" r="80" fill="url(#coreGlowAvatar)" opacity="0.2"/>

  <!-- Character face -->
  <g transform="translate(100, 100)">
    <!-- Hair (brown wavy) -->
    <ellipse cx="0" cy="-25" rx="50" ry="35" fill="url(#hairAvatar)"/>
    <path d="M -50,-25 Q -52,-15 -48,-5" stroke="url(#hairAvatar)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 50,-25 Q 52,-15 48,-5" stroke="url(#hairAvatar)" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Side-swept bangs -->
    <path d="M -35,-40 Q -20,-45 -5,-40 Q 5,-38 10,-30" fill="url(#hairAvatar)" opacity="0.9"/>
    <path d="M -25,-42 Q -10,-46 0,-42" stroke="url(#hairAvatar)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Head/Face -->
    <ellipse cx="0" cy="-5" rx="40" ry="45" fill="#FFE8D6"/>

    <!-- Eyes (large, amber/golden-brown) -->
    <ellipse cx="-16" cy="-10" rx="10" ry="13" fill="#FFFFFF"/>
    <ellipse cx="16" cy="-10" rx="10" ry="13" fill="#FFFFFF"/>
    <ellipse cx="-16" cy="-9" rx="7" ry="10" fill="#D2A44C"/>
    <ellipse cx="16" cy="-9" rx="7" ry="10" fill="#D2A44C"/>
    <circle cx="-16" cy="-10" r="4" fill="#6B4E2C"/>
    <circle cx="16" cy="-10" r="4" fill="#6B4E2C"/>
    <circle cx="-14" cy="-12" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="18" cy="-12" r="1.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Smile -->
    <path d="M -13,8 Q 0,13 13,8" stroke="#9B8FD9" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Neck/collar -->
    <rect x="-12" y="33" width="24" height="12" fill="#FFE8D6"/>
    <path d="M -20,45 L -15,35 L 15,35 L 20,45 Z" fill="#9B8FD9" opacity="0.9"/>

    <!-- Bodysuit shoulder -->
    <ellipse cx="0" cy="55" rx="28" ry="15" fill="#FFFFFF" opacity="0.95"/>

    <!-- Cyan core indicator (small version) -->
    <circle cx="0" cy="58" r="6" fill="#00F0FF" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="58" r="3" fill="#00DDEE" opacity="0.9"/>

    <!-- Purple shoulder accent -->
    <ellipse cx="-28" cy="48" rx="8" ry="10" fill="#9B8FD9" opacity="0.8"/>
    <ellipse cx="28" cy="48" rx="8" ry="10" fill="#9B8FD9" opacity="0.8"/>

    <!-- Tech badge -->
    <circle cx="25" cy="38" r="7" fill="#D2A44C"/>
    <text x="25" y="42" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">葵</text>

    <!-- Status indicator -->
    <circle cx="42" cy="-30" r="5" fill="#00FF00">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="-30" r="7" stroke="#00FF00" stroke-width="1" fill="none" opacity="0.6">
      <animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Label -->
  <text x="100" y="178" font-size="20" fill="#9B8FD9" text-anchor="middle" font-weight="bold">aOi</text>
</svg>
