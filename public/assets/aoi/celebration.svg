  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad5)"/>
  <circle cx="256" cy="256" r="250" fill="url(#overlayGrad5)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

