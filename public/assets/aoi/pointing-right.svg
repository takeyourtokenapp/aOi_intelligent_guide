<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b87f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F0FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad2)"/>
  <circle cx="256" cy="256" r="250" fill="url(#overlayGrad2)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Silhouette with pointing arm -->
  <ellipse cx="220" cy="180" rx="55" ry="65" fill="#ffffff" fill-opacity="0.3"/>
  <path d="M150 270 Q150 210 220 210 Q290 210 290 270 L290 380 Q290 420 220 420 Q150 420 150 380 Z" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Pointing arm -->
  <path d="M290 260 L380 220 L390 230 L310 280 Z" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="390" cy="225" r="12" fill="#ffffff" fill-opacity="0.5"/>

  <!-- Arrow indicator -->
  <path d="M400 225 L440 225 L430 215 M440 225 L430 235" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="126" y="460" width="260" height="36" rx="18" fill="#ffffff" fill-opacity="0.9"/>
  <text x="256" y="485" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#9b87f5" text-anchor="middle">POINTING-RIGHT</text>

  <!-- Kanji -->
  <text x="220" y="200" font-family="serif" font-size="40" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">葵</text>
</svg>