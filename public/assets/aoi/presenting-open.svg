<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D2A44C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad3)"/>
  <circle cx="256" cy="256" r="250" fill="url(#overlayGrad3)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Silhouette -->
  <ellipse cx="256" cy="180" rx="55" ry="65" fill="#ffffff" fill-opacity="0.3"/>
  <path d="M190 270 Q190 210 256 210 Q322 210 322 270 L322 380 Q322 420 256 420 Q190 420 190 380 Z" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Left hand OK gesture -->
  <circle cx="120" cy="280" r="30" fill="#ffffff" fill-opacity="0.3"/>
  <ellipse cx="120" cy="280" rx="15" ry="20" fill="#ffffff" fill-opacity="0.4"/>
  <path d="M100 260 L90 240 M120 250 L120 225 M140 260 L150 240" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Right hand OK gesture -->
  <circle cx="392" cy="280" r="30" fill="#ffffff" fill-opacity="0.3"/>
  <ellipse cx="392" cy="280" rx="15" ry="20" fill="#ffffff" fill-opacity="0.4"/>
  <path d="M372 260 L362 240 M392 250 L392 225 M412 260 L422 240" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Arms -->
  <path d="M190 280 L150 280" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-opacity="0.2"/>
  <path d="M322 280 L362 280" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-opacity="0.2"/>

  <!-- Label -->
  <rect x="116" y="460" width="280" height="36" rx="18" fill="#ffffff" fill-opacity="0.9"/>
  <text x="256" y="485" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#D2A44C" text-anchor="middle">PRESENTING-OPEN</text>

  <!-- Kanji -->
  <text x="256" y="200" font-family="serif" font-size="40" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">葵</text>
</svg>