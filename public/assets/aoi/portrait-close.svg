<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B8FD9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7BA7BC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad4)"/>
  <circle cx="256" cy="256" r="250" fill="url(#overlayGrad4)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Large face close-up -->
  <ellipse cx="256" cy="240" rx="140" ry="160" fill="url(#faceGlow)"/>

  <!-- Eyes placeholder -->
  <ellipse cx="200" cy="210" rx="25" ry="18" fill="#ffffff" fill-opacity="0.4"/>
  <ellipse cx="312" cy="210" rx="25" ry="18" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="200" cy="210" r="10" fill="#9B8FD9"/>
  <circle cx="312" cy="210" r="10" fill="#9B8FD9"/>

  <!-- Gentle smile -->
  <path d="M200 290 Q256 330 312 290" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Hair suggestion -->
  <path d="M120 180 Q150 80 256 70 Q362 80 392 180" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- Label -->
  <rect x="126" y="460" width="260" height="36" rx="18" fill="#ffffff" fill-opacity="0.9"/>
  <text x="256" y="485" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#9B8FD9" text-anchor="middle">PORTRAIT-CLOSE</text>

  <!-- Kanji on forehead area -->
  <text x="256" y="150" font-family="serif" font-size="36" fill="#ffffff" text-anchor="middle" fill-opacity="0.6">葵</text>
</svg>